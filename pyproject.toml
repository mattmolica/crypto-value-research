[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-value-research"
version = "0.1.0"
description = "Value-investing research tools for crypto assets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.32",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.9",
    "tabulate>=0.9",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25", "db-dtypes>=1.3"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29", "ipywidgets>=8.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
